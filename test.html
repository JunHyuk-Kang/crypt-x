<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Crypt X Sign In</title>
  <style>
    /* 전체 body 스타일 */
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      font-family: 'Poppins', 'Arial', sans-serif;
      overflow: hidden;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #240026; /* 보라색 배경 기본색 */
      position: relative;
    }

    /* SVG 배경 위치 및 크기 조절 */
    #background-svg {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      user-select: none;
      pointer-events: none;
    }

    /* 타이틀 텍스트 스타일 */
    .logo {
      font-weight: 900;
      font-size: 3.5rem;
      background: linear-gradient(90deg, #3a88ec 0%, #9b33db 75%, #ea11cb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4.5rem;
      user-select: none;
      white-space: nowrap;
    }

    /* X 글자만 핑크로 특별 강조 */
    .logo .highlight {
      color: #ea11cb;
      background: none !important;
      -webkit-text-fill-color: #ea11cb !important;
    }

    /* Sign in 버튼 */
    .sign-in-button {
      font-weight: 900;
      font-size: 2.25rem;
      padding: 1.25rem 4rem;
      border: 3.5px solid white;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease, border-color 0.3s ease;
      margin-bottom: 2rem;
      user-select: none;
      white-space: nowrap;
    }

    .sign-in-button:hover,
    .sign-in-button:focus {
      background-color: #ea11cb;
      border-color: #ea11cb;
      outline: none;
    }

    /* Sign up 텍스트 */
    .sign-up-text {
      font-weight: 600;
      font-size: 1rem;
      user-select: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- SVG 배경 -->
  <svg id="background-svg" viewBox="0 0 1440 560" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#240026" />
        <stop offset="50%" stop-color="#b406cb" />
        <stop offset="100%" stop-color="#2d008a" />
      </linearGradient>
      <filter id="blur-filter" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="50" />
      </filter>
    </defs>
    <!-- 물결 모양 Path -->
    <path fill="url(#grad1)" filter="url(#blur-filter)" fill-opacity="0.9" d="
      M0,310 
      C300,360 480,210 720,260 
      C960,310 1140,450 1440,390 
      L1440,560 
      L0,560 
      Z 
    "/>
  </svg>

  <!-- 콘텐츠 -->
  <div class="logo">Crypt <span class="highlight">X</span></div>
  <button class="sign-in-button">Sign in</button>
  <div class="sign-up-text">Sign up for free now</div>
</body>
</html>
